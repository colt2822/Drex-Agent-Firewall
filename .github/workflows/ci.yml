name: CI
on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install namespace and offline agent-version dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-venv
          sudo npm install -g @openai/codex@0.152.1
          sudo ln -sf "$(command -v codex)" /usr/bin/codex
          python3 -m venv /tmp/firewall-ci-venv
          /tmp/firewall-ci-venv/bin/pip install -r requirements.lock && /tmp/firewall-ci-venv/bin/pip install --no-deps '.[dev]'
      - name: Delegate bounded cgroup controllers to the test launcher
        run: |
          sudo mkdir /sys/fs/cgroup/drex-ci
          sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo sh -c 'echo "+cpu +memory +pids" > /sys/fs/cgroup/drex-ci/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/drex-ci/launcher
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/drex-ci
      - name: Sequential security suite; no xdist or critical skips
        run: |
          echo "$$" | sudo tee /sys/fs/cgroup/drex-ci/launcher/cgroup.procs >/dev/null
          mkdir -p /tmp/firewall-ci-home
          export HOME=/tmp/firewall-ci-home XDG_CONFIG_HOME=/tmp/firewall-ci-home/config DREX_API_KEY=
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          /tmp/firewall-ci-venv/bin/python -c 'import pathlib, drex_agent_firewall; p=pathlib.Path(drex_agent_firewall.__file__).resolve(); assert p == (pathlib.Path.cwd()/"src/drex_agent_firewall/__init__.py").resolve(), p'
          /tmp/firewall-ci-venv/bin/python -m pytest -q --junitxml=/tmp/host-security.xml
          /tmp/firewall-ci-venv/bin/python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/host-security.xml"); assert sum(int(s.get("skipped",0)) for s in r.iter("testsuite")) == 0'
          /tmp/firewall-ci-venv/bin/drex-firewall benchmark
      - name: Clean public-source install canary
        run: |
          echo "$$" | sudo tee /sys/fs/cgroup/drex-ci/launcher/cgroup.procs >/dev/null
          /tmp/firewall-ci-venv/bin/python security/v013/clean_install.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-security-evidence
          path: /tmp/host-security.xml
  oci-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh image build; installed wheel only
        run: docker build --no-cache -t drex-agent-firewall:validation .
      - name: OCI outer-boundary attacks and fail-closed lifecycle
        run: |
          python -m venv /tmp/firewall-oci-venv
          /tmp/firewall-oci-venv/bin/pip install -r requirements.lock && /tmp/firewall-oci-venv/bin/pip install --no-deps '.[dev]'
          mkdir -p /tmp/firewall-oci-home
          HOME=/tmp/firewall-oci-home XDG_CONFIG_HOME=/tmp/firewall-oci-home/config DREX_API_KEY= /tmp/firewall-oci-venv/bin/pytest -q security/v013/test_oci_runtime.py --junitxml=/tmp/oci-security.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oci-security-evidence
          path: /tmp/oci-security.xml
